# pyproject.toml — el paquete de Python de Qhawana (el Observatorio de datos): dependencias y extras
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhawana"
version = "0.1.0"
description = "Qhawana: el Observatorio de datos de la plataforma Qillqa (la página de datos que construye datafw con el tema de quien la muestra), que funciona dentro de Qillqa o solo con el anfitrión mínimo de Tiqsi."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["tiqsi", "fastapi>=0.110", "pydantic-settings>=2", "PyJWT>=2.8"]

[project.optional-dependencies]
sola = ["uvicorn[standard]>=0.30"]
pruebas = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["qhawana"]
